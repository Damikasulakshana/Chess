<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Deep ink background with rounded corners -->
  <rect width="64" height="64" rx="14" fill="#1A1A1A"/>
  
  <!-- Subtle inner border -->
  <rect x="3" y="3" width="58" height="58" rx="11" fill="none" stroke="#C0392B" stroke-width="2"/>
  
  <!-- Chess King Symbol in championship crimson & cream -->
  <g fill="#F5F0E0" stroke="#C0392B" stroke-width="1.5" stroke-linejoin="round">
    <!-- Cross on top -->
    <path d="M32 10 v7 M28.5 13.5 h7" stroke="#C0392B" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Crown -->
    <path d="M22 24 C22 20 26 19 32 19 C38 19 42 20 42 24 C42 28 39 31 32 31 C25 31 22 28 22 24 Z" fill="#C0392B" stroke="#F5F0E0"/>
    
    <!-- Robe / Body -->
    <path d="M20 50 C22 36 25 31 32 31 C39 31 42 36 44 50 Z" fill="#F5F0E0"/>
    
    <!-- Belt / Waist detail -->
    <path d="M24 37 Q32 39 40 37" fill="none" stroke="#C0392B" stroke-width="2"/>
    
    <!-- Base pedestal -->
    <path d="M16 54 L48 54 C48 51 46 50 44 50 L20 50 C18 50 16 51 16 54 Z" fill="#C0392B"/>
    <rect x="14" y="54" width="36" height="4" rx="1.5" fill="#F5F0E0" stroke="#1A1A1A"/>
  </g>
</svg>
